# ─────────────────────────────────────────────────────────────────────────────
#  TontumaBot V3
#
#  Sur une machine neuve :  ./setup.sh          (fait tout, de bout en bout)
#
#  À la main :
#    1) cp .env.example .env  puis renseigner GROQ_API_KEY (ou GEMINI_API_KEY)
#    2) docker compose build
#    3) docker compose run --rm download-models   # ~4 Go, une seule fois
#    4) docker compose up -d
#       → http://localhost:8008/borne
#
#  HF_CACHE_DIR (.env) pointe sur le cache HuggingFace à partager avec l'hôte.
#  setup.sh le règle sur ~/.cache/huggingface pour éviter tout retéléchargement.
#
#  SUR MAC APPLE SILICON — à lire avant de déployer une borne :
#
#  Un conteneur n'a pas accès à Metal. Docker Desktop fait tourner une machine
#  virtuelle Linux, où MPS n'existe pas : tout passe sur CPU, y compris la
#  synthèse vocale. Mesuré sur la même machine et le même texte, la synthèse
#  passe d'un facteur 2,0 à 5,7-6,8 fois la durée de l'audio produit — une
#  réponse parlée de quinze secondes demande 90 à 105 s au lieu de 30 s.
#
#  Pour une borne en service sur un Mac, lancer l'application en natif
#  (`python app.py` dans le venv) : c'est le seul moyen d'utiliser le GPU.
#  Ce conteneur sert à livrer le projet sur un serveur Linux, et à disposer
#  d'un environnement reproductible pour les tests.
#
#  Prévoir enfin la mémoire de la VM : les modèles pèsent 6,5 Go mesurés, et
#  Docker Desktop n'alloue par défaut qu'une fraction de la RAM de l'hôte.
#  En dessous de 10 Go, le conteneur est tué sans message explicite
#  (Réglages → Resources → Memory).
# ─────────────────────────────────────────────────────────────────────────────
services:
  api:
    build: .
    image: tontumabot-v3:latest
    container_name: tontumabot-v3
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: "0.0.0.0"
      PORT: "8008"
    ports:
      - "${PORT:-8008}:8008"
    volumes:
      # Cache HuggingFace partagé avec l'hôte : les modèles déjà téléchargés
      # ne le sont pas une seconde fois. Chemin réglable via HF_CACHE_DIR
      # dans .env (setup.sh le renseigne).
      - ${HF_CACHE_DIR:-./docker/hf-cache}:/app/.cache/huggingface
      # STT wolof : .env pointe sur ./src/stt_wolof-hubert-ctc
      - ./src/stt_wolof-hubert-ctc:/app/src/stt_wolof-hubert-ctc:ro
      # Base vectorielle ChromaDB : le conteneur voit le corpus indexé.
      # Ne pas lancer l'app en natif ET en conteneur en même temps — deux
      # écrivains sur le même SQLite.
      - ./data/chroma:/app/data/chroma
      # Audios reçus de la borne et documents administrés
      - uploads:/app/uploads
      # Audios TTS produits par la borne. Sans ce montage, ils s'écrivent dans
      # la couche du conteneur : ils grossissent sans limite et disparaissent au
      # premier `--force-recreate`. Depuis le découpage de la synthèse, une
      # réponse produit N+1 fichiers (les morceaux diffusés, plus l'assemblage)
      # de ~500 Ko chacun — l'accumulation est rapide et rien ne la purge.
      # Le dossier porte aussi borne.html/borne.js/index.html : on monte donc
      # celui de l'hôte, comme pour ./src/stt_wolof-hubert-ctc, plutôt qu'un
      # volume nommé qui masquerait ces fichiers.
      - ./static:/app/static
      # Certificats HTTPS optionnels (SSL_CERTFILE / SSL_KEYFILE dans .env)
      - ./certs:/app/certs:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8008/health"]
      interval: 30s
      timeout: 10s
      # Le warm-up charge tous les modèles PUIS fait une synthèse à vide pour
      # compiler les noyaux de calcul. Mesuré sur CPU : 30 s pour charger le
      # TTS et 58 s pour le préchauffer, sans compter NLLB, l'embedder, le
      # reranker et le STT. Trop court, le conteneur est déclaré malade avant
      # d'avoir fini de démarrer, et `restart: unless-stopped` le relance en
      # boucle sans jamais le laisser aboutir.
      start_period: 600s
      retries: 3

  # Service à la demande : télécharge les poids dans les volumes, puis sort.
  #   docker compose run --rm download-models
  download-models:
    build: .
    image: tontumabot-v3:latest
    profiles: ["setup"]
    env_file: .env
    volumes:
      # Écrit dans le cache et l'arborescence src/ de l'hôte : les poids
      # servent aussi bien au conteneur qu'à une exécution native.
      - ${HF_CACHE_DIR:-./docker/hf-cache}:/app/.cache/huggingface
      - ./src:/app/src
    command: ["python", "download_models.py"]

volumes:
  uploads:
