<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TontumaBot V3 — Assistant administratif</title>
  <style>
    :root {
      --bg: #060a14;
      --card: rgba(255, 255, 255, 0.045);
      --card-hover: rgba(255, 255, 255, 0.085);
      --border: rgba(255, 255, 255, 0.09);
      --border-strong: rgba(255, 255, 255, 0.18);
      --text: #eaf0ff;
      --muted: #8b96b8;
      --green: #2ee6a6;
      --green2: #10b981;
      --accent: #5b8cff;
      --accent2: #7c6cff;
      --danger: #ff5c7a;
      --radius: 18px;
      --radius-sm: 12px;
      --shadow: 0 16px 50px rgba(0, 0, 0, 0.45);
      --shadow-soft: 0 4px 18px rgba(0, 0, 0, 0.28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background:
        radial-gradient(1000px 560px at 85% -12%, rgba(91, 140, 255, 0.20), transparent 62%),
        radial-gradient(760px 480px at 6% 112%, rgba(46, 230, 166, 0.14), transparent 60%),
        var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      justify-content: center;
      overflow: hidden;
      letter-spacing: 0.1px;
    }

    .app {
      width: 100%;
      max-width: 920px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px 16px 0;
    }

    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 4px 4px 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 4px;
    }

    .logo {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--green), var(--accent) 92%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      box-shadow: 0 10px 30px rgba(91, 140, 255, 0.42),
        inset 0 1px 0 rgba(255, 255, 255, 0.28);
      flex-shrink: 0;
    }

    h1 {
      font-size: 19px;
      font-weight: 750;
      letter-spacing: -0.2px;
    }

    .sub {
      color: var(--muted);
      font-size: 12px;
      margin-top: 1px;
    }

    .badges {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 500;
      padding: 5px 11px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      backdrop-filter: blur(8px);
    }

    .badge::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      opacity: .5;
    }

    .badge.on {
      color: var(--green);
      border-color: rgba(46, 230, 166, 0.35);
      background: rgba(46, 230, 166, 0.08);
    }

    .badge.on::before {
      background: var(--green);
      opacity: 1;
      box-shadow: 0 0 8px rgba(46, 230, 166, 0.8);
    }

    /* ---- Chat ---- */
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 12px 4px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .chat::-webkit-scrollbar {
      width: 6px;
    }

    .chat::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    .chat::-webkit-scrollbar-thumb:hover {
      background: var(--border-strong);
    }

    .msg {
      display: flex;
      gap: 10px;
      max-width: 85%;
      animation: pop .25s ease;
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .msg.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }

    .msg.user .avatar {
      background: linear-gradient(135deg, var(--accent), #6f5cff);
    }

    .msg.bot .avatar {
      background: linear-gradient(135deg, var(--green), var(--green2));
    }

    .bubble {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      border-top-left-radius: 5px;
      padding: 12px 15px;
      line-height: 1.62;
      font-size: 14px;
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow-soft);
    }

    .msg.user .bubble {
      background: linear-gradient(135deg, rgba(91, 140, 255, 0.20), rgba(124, 108, 255, 0.16));
      border-color: rgba(91, 140, 255, 0.38);
      border-radius: 16px;
      border-top-right-radius: 5px;
    }

    .bubble .lang-tag {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--green);
      text-transform: uppercase;
      margin-bottom: 6px;
      display: block;
    }

    .bubble .original {
      color: var(--muted);
      font-size: 12.5px;
      margin-bottom: 4px;
      font-style: italic;
    }

    /* Pipeline trace */
    .trace {
      margin-top: 10px;
      border-top: 1px solid var(--border);
      padding-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
    }

    .step .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--border);
      flex-shrink: 0;
    }

    .step.done .dot {
      background: var(--green);
      box-shadow: 0 0 8px rgba(34, 211, 154, 0.6);
    }

    .step b {
      color: var(--text);
      font-weight: 600;
    }

    .step .val {
      color: var(--accent);
    }

    .audio {
      margin-top: 10px;
      width: 100%;
    }

    .context {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
      border-left: 2px solid var(--border);
      padding-left: 10px;
      max-height: 90px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    .typing {
      display: inline-flex;
      gap: 4px;
      align-items: center;
      padding: 4px 2px;
    }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
      animation: blink 1.2s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: .2s;
    }

    .typing span:nth-child(3) {
      animation-delay: .4s;
    }

    /* Progression du pipeline, dans la bulle de traitement : elle naît et
       disparaît avec elle, sans rien déplacer dans la page. */
    .progress {
      margin-top: 8px;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .progress > i {
      display: block;
      height: 100%;
      width: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--green));
    }

    /* Pendant la synthèse vocale, la jauge passe au vert : le texte est déjà
       connu, ce qui reste à attendre est l'audio. */
    .progress.tts > i {
      background: linear-gradient(90deg, var(--green), var(--accent2));
    }

    .step-label {
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
    }

    @keyframes blink {

      0%,
      80%,
      100% {
        opacity: .2;
      }

      40% {
        opacity: 1;
      }
    }

    /* ---- Saisie ---- */
    .composer {
      padding: 14px;
      margin: 6px 0 16px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.025));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: blur(14px);
      box-shadow: var(--shadow);
    }

    .tools {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .tool {
      flex: 1;
      padding: 10px;
      text-align: center;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      transition: all .2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .tool:hover {
      border-color: var(--border-strong);
      background: var(--card-hover);
      color: var(--text);
      transform: translateY(-1px);
    }

    .tool .fn {
      font-size: 10px;
      opacity: .7;
    }

    .tool.rec {
      background: rgba(255, 92, 122, 0.18);
      border-color: rgba(255, 92, 122, 0.6);
      color: #ff8ba1;
      animation: pulse 1.2s infinite;
    }

    .tool.rec:hover {
      color: #ff8ba1;
    }

    @keyframes pulse {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(255, 92, 122, 0.35);
      }

      50% {
        box-shadow: 0 0 0 9px rgba(255, 92, 122, 0);
      }
    }

    .inputrow {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      padding: 13px 15px;
      font-size: 14px;
      font-family: inherit;
      line-height: 1.5;
      resize: none;
      max-height: 120px;
      transition: border .2s, box-shadow .2s;
    }

    textarea::placeholder {
      color: var(--muted);
      opacity: .7;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(91, 140, 255, 0.15);
    }

    .btn {
      background: linear-gradient(135deg, var(--green), var(--accent));
      color: #fff;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      width: 48px;
      height: 48px;
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 8px 22px rgba(91, 140, 255, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.25);
      transition: transform .15s, filter .2s, box-shadow .2s;
    }

    .btn:hover {
      filter: brightness(1.08);
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(91, 140, 255, 0.5);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none;
    }

    .side {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .switch {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--muted);
      cursor: pointer;
    }

    .switch input {
      accent-color: var(--green);
      width: 14px;
      height: 14px;
    }

    .tts-select {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-size: 11px;
      padding: 4px 6px;
      cursor: pointer;
      outline: none;
      transition: border .2s;
    }

    .tts-select:focus {
      border-color: var(--accent);
    }

    .tts-select option {
      background: #151d33;
      color: var(--text);
    }

    .examples {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .chip {
      font-size: 11.5px;
      padding: 7px 12px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      transition: all .2s;
    }

    .chip:hover {
      border-color: var(--border-strong);
      background: var(--card-hover);
      color: var(--text);
      transform: translateY(-1px);
    }

    .fileinfo {
      font-size: 11px;
      color: var(--green);
      margin-top: 8px;
      display: none;
    }

    .fileinfo.show {
      display: block;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 27, 48, 0.92);
      border: 1px solid rgba(91, 140, 255, 0.5);
      color: var(--text);
      padding: 11px 20px;
      border-radius: 12px;
      font-size: 13px;
      z-index: 50;
      display: none;
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
    }

    .toast.show {
      display: block;
      animation: pop .2s ease;
    }

    @media (max-width: 640px) {
      .app {
        padding: 12px 10px 0;
      }

      .msg {
        max-width: 92%;
      }

      .badges {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <div class="logo">T</div>
      <div>
        <h1>TontumaBot</h1>
        <div class="sub">Assistant administratif — Wolof · Français · RAG</div>
      </div>
<div class="badges">
      <span class="badge" id="badge-llm">LLM: —</span>
      <span class="badge" id="badge-lang">Détecteur actif</span>
      <span class="badge on" id="badge-v2">V3 — Reranker</span>
      <span class="badge on" id="badge-sse">REST + SSE</span>
    </div>
    </header>

    <div class="chat" id="chat"></div>

    <div class="composer">
      <div class="tools">
        <button class="tool" id="btn-audio">🎙️ <span>Parler</span> <span class="fn"
            id="rec-timer">micro</span></button>
        <button class="tool" id="btn-image">🖼️ <span>Photo / Doc</span> <span class="fn">OCR</span></button>
      </div>
      <div class="fileinfo" id="fileinfo"></div>
      <div class="inputrow">
        <textarea id="input" rows="1" placeholder="Écrivez en wolof ou en français…"></textarea>
        <div class="side">
          <label class="switch"><input type="checkbox" id="tts" checked>🔊</label>
          <select class="tts-select" id="tts-engine">
            <!-- <option value="speecht5">SpeechT5</option> -->
            <option value="oolel">Oolel-Voices</option>
          </select>
          <button class="btn" id="send" title="Envoyer">➤</button>
        </div>
      </div>
      <div class="examples">
        <span class="chip" data-q="dama beug wout kayitu juddu ?">🇸🇳 dama beug wout kayitu juddu ?</span>
        <span class="chip" data-q="dama beug wout acte de deces?">🇸🇳 dama beug wout acte de deces?</span>
        <span class="chip" data-q="Où dois-je déposer ma demande de carte d'identité ?">Où déposer ma demande ?</span>
        <span class="chip" data-q="Comment créer une entreprise au Sénégal ?">Créer une entreprise ?</span>
        <span class="chip" data-q="Combien coûte un passeport ?">Coût d'un passeport ?</span>
      </div>
    </div>

    <input type="file" id="file-image" accept="image/*" hidden>
    <input type="file" id="file-audio" accept="audio/*" capture hidden>
    <div class="toast" id="toast"></div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const chat = $('chat');

    // Mémoire conversationnelle : une session par onglet, réinitialisée côté
    // serveur tous les 10 messages.
    const SESSION_ID = (() => {
      try { return crypto.randomUUID(); }
      catch (_) { return 'web-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8); }
    })();

    // ---- état LLM ----
    (async () => {
      try {
        const res = await fetch('/health');
        const d = await res.json();
        $('badge-llm').textContent = 'LLM: ' + (d.llm_ready ? d.llm_provider.toUpperCase() + ' ✓' : 'fallback');
        $('badge-llm').classList.toggle('on', d.llm_ready);
        if (d.tts_engine) {
          const sel = $('tts-engine');
          sel.value = d.tts_engine;
        }
      } catch (_) { }
    })();

    // ---- helpers ----
    const esc = s => (s == null ? '' : String(s)).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    function toast(msg) {
      const t = $('toast'); t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    function addMsg(role, html, extra) {
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      div.innerHTML = '<div class="avatar">' + (role === 'user' ? '👤' : '🤖') + '</div><div class="bubble">' + html + '</div>';
      if (extra) Object.assign(div.style, extra);
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    function addTyping() {
      const div = document.createElement('div');
      div.className = 'msg bot';
      div.id = 'typing';
      // Structure fixe : seuls le texte du libellé et la largeur de la jauge
      // changent ensuite. Réécrire la bulle à chaque étape remettrait la barre
      // à zéro à chacune d'elles.
      div.innerHTML = '<div class="avatar">🤖</div><div class="bubble">' +
        '<div class="typing"><span></span><span></span><span></span></div>' +
        '<div class="step-label" id="typing-label">⏳ Démarrage…</div>' +
        '<div class="progress" id="typing-progress"><i></i></div></div>';
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      progresRAZ();
    }
    function removeTyping() {
      progresArret();
      const t = $('typing');
      if (t) t.remove();
    }

    // ---- progression du pipeline ----
    //  Chaque étape porte un jalon : la place estimée de sa fin sur la jauge.
    //  Les poids ne sont pas uniformes — quand le TTS est demandé, la synthèse
    //  pèse à elle seule plus que toute la chaîne RAG (48 s contre 11 s sur une
    //  réponse type), et des parts égales donneraient une jauge qui bondit à
    //  90 % puis paraît figée.
    //
    //  L'aiguille ne saute pas d'un jalon au suivant : elle s'en approche par
    //  fractions, vite puis de plus en plus lentement. Une étape de vingt
    //  secondes garde ainsi une barre qui avance, sans jamais dépasser le
    //  jalon annoncé par le serveur.
    const JALONS = {
      start: 3, stt: 10, detect: 14, translate_in: 20, intent: 24,
      retrieval: 32, llm: 44, translate_out: 56, tts: 62,
    };
    const JALON_TTS = 62, JALON_FIN_TTS = 97;
    let progresCible = 0, progresAffiche = 0, progresTimer = null;
    let progresFacteur = 1, avecTTS = false;

    function progresRAZ() {
      progresCible = progresAffiche = 0;
      progresFacteur = 1;
      avecTTS = false;
      clearInterval(progresTimer);
      progresTimer = setInterval(() => {
        const barre = document.querySelector('#typing-progress > i');
        if (!barre) return;
        const ecart = progresCible - progresAffiche;
        if (Math.abs(ecart) < 0.05) return;
        progresAffiche += ecart * 0.07;
        barre.style.width = progresAffiche.toFixed(2) + '%';
      }, 80);
    }

    function progresArret() { clearInterval(progresTimer); progresTimer = null; }

    function progresVers(pct) {
      progresCible = Math.max(progresCible, pct);   // une jauge ne recule pas
    }

    // La course s'arrête à un jalon différent selon le travail demandé : la
    // synthèse (qui pousse ensuite la jauge morceau par morceau), la traduction
    // de sortie pour une question wolof sans TTS, ou la rédaction pour une
    // question française. Les jalons sont mis à l'échelle de cette fin-là,
    // sinon la réponse arrive sur une barre aux deux tiers.
    function progresEchelle(synthese, langue) {
      if (synthese) return 1;                      // 62 → 97 tenu par les morceaux
      const dernier = langue === 'fr' ? JALONS.llm : JALONS.translate_out;
      return 95 / dernier;
    }

    function progresEtape(step, data) {
      if (step === 'start')  { avecTTS = !!(data && data.tts); progresFacteur = progresEchelle(avecTTS, null); }
      if (step === 'detect') progresFacteur = Math.max(progresFacteur, progresEchelle(avecTTS, data && data.lang));
      if (step === 'tts' || step === 'tts_chunk') {
        const jauge = $('typing-progress');
        if (jauge) jauge.classList.add('tts');
      }
      if (step === 'tts_chunk') {
        const part = data && data.total ? data.index / data.total : 0;
        progresVers(JALON_TTS + (JALON_FIN_TTS - JALON_TTS) * part);
        return;
      }
      if (JALONS[step] !== undefined) progresVers(JALONS[step] * progresFacteur);
    }

    // ---- pipeline trace dans la réponse ----
    function buildTrace(t) {
      if (!t) return '';
      const steps = [];
      if (t.input_lang) steps.push(['Langue', String(t.input_lang).toUpperCase(), true]);
      if (t.wolof_to_french) {
        const wtf = t.wolof_to_french;
        const label = wtf.result ? esc(wtf.result) : (wtf.latency_ms ? wtf.latency_ms + 'ms' : 'ok');
        steps.push(['Traduction WO→FR', label, true]);
      }
      if (t.intent) steps.push(['Intention', esc(t.intent), true]);
      if (t.retrieval) {
        const r = t.retrieval;
        steps.push(['Recherche', r.n_candidates + ' candidats → ' + (r.n_reranked || r.n_mmr || 0) + ' retenus', true]);
      }
      if (t.reranker && t.reranker.input_docs != null) {
        steps.push(['Reranker', t.reranker.input_docs + ' docs → ' + t.reranker.output_docs + ' docs', true]);
      }
      if (t.french_to_wolof) {
        const ftw = t.french_to_wolof;
        const label = ftw.latency_ms ? ftw.latency_ms + 'ms' : 'ok';
        steps.push(['Traduction FR→WO', label, true]);
      }
      if (!steps.length) return '';
      return '<div class="trace">' + steps.map(s =>
        '<div class="step done"><span class="dot"></span><b>' + s[0] + ':</b> <span class="val">' + s[1] + '</span></div>'
      ).join('') + '</div>';
    }

    function renderAnswer(data) {
      if (!data || typeof data !== 'object') {
        addMsg('bot', '❌ Réponse invalide du serveur');
        return;
      }
      const t = data.trace || {};
      const isWo = t.input_lang === 'wo';
      const langTag = '<span class="lang-tag">' + (isWo ? 'Réponse en wolof 🇸🇳' : 'Réponse en français') + '</span>';

      let html = langTag;
      if (data.response_fr && data.response_wo) {
        html += '<div class="original">FR : ' + esc(data.response_fr) + '</div>';
      }
      const mainText = data.response || data.response_fr || data.answer || data.text || '';
      html += '<div>' + esc(mainText) + '</div>';

      if (data.audio_url) {
        html += '<audio class="audio" controls src="' + esc(data.audio_url) + '?' + Date.now() + '"></audio>';
      }

      // QR Code pour les procédures
      if (data.qr_code) {
        html += '<div class="qr-code" style="margin-top:12px;text-align:center;">' +
          '<div style="font-size:11px;color:var(--muted);margin-bottom:6px;">📱 Scannez pour sauvegarder la procédure</div>' +
          '<img src="data:image/png;base64,' + data.qr_code + '" alt="QR Code procédure" style="max-width:200px;border:1px solid var(--border);border-radius:8px;background:white;padding:8px;">' +
          '</div>';
      }

      html += buildTrace(t);
      if (t.context) html += '<div class="context">📄 Contexte : ' + esc(String(t.context).slice(0, 400)) + '</div>';
      addMsg('bot', html);
    }

    // ---- Client SSE (Server-Sent Events) ----
    // Libellés d'étape affichés pendant le streaming de la réponse.
    const STEP_LABELS = {
      start:         '⏳ Démarrage…',
      stt:           '🎙️ Transcription…',
      detect:        '🌐 Détection de la langue…',
      translate_in:  '🔄 Traduction WO→FR…',
      intent:        '🧭 Analyse de l’intention…',
      retrieval:     '🔍 Recherche documentaire…',
      llm:           '🤖 Génération de la réponse…',
      translate_out: '🔄 Traduction FR→WO…',
      tts:           '🔊 Synthèse vocale…',
      tts_chunk:     '🔊 Synthèse vocale…',
    };

    // Cette page lit la réponse d'un seul tenant (<audio controls> sur
    // `audio_url`) : les morceaux diffusés ne servent ici qu'à afficher
    // l'avancement de la synthèse. La borne, elle, les enchaîne (borne.js).
    function updateTyping(step, data) {
      progresEtape(step, data);
      const lab = $('typing-label');
      if (!lab) return;
      let label = STEP_LABELS[step] || esc(step);
      if (step === 'tts_chunk' && data && data.total > 1) {
        label = '🔊 Synthèse vocale… (' + data.index + '/' + data.total + ')';
      }
      lab.innerHTML = label;
    }

    // Consomme un flux SSE (event: <nom>\ndata: <json>\n\n) et route les événements.
    async function consumeSSE(res, { onStatus, onResult, onError }) {
      if (!res.body) { onError('Réponse sans flux'); return; }
      const ct = res.headers.get('content-type') || '';
      if (!ct.includes('text/event-stream')) {
        // Erreur renvoyée en JSON (400/404/500) plutôt qu'en SSE
        let msg = 'Erreur ' + res.status;
        try { const j = await res.json(); msg = j.detail || msg; } catch (_) {}
        onError(msg);
        return;
      }
      const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
      let buffer = '';
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += value;
        const blocks = buffer.split('\n\n');
        buffer = blocks.pop();                 // fragment incomplet conservé
        for (const block of blocks) {
          if (!block.trim()) continue;
          const ev = (block.match(/^event: (.*)$/m) || [])[1] || 'message';
          let data = {};
          try { data = JSON.parse((block.match(/^data: (.*)$/m) || [])[1] || '{}'); } catch (_) {}
          if (ev === 'status')      onStatus && onStatus(data);
          else if (ev === 'result') onResult && onResult(data);
          else if (ev === 'error')  onError  && onError(data.message || 'Erreur');
          // 'done' → fin du flux, rien à faire
        }
      }
    }

    async function sendText(text, tts) {
      if (!text.trim()) return;
      addMsg('user', esc(text));
      $('input').value = '';
      autoGrow();
      addTyping();
      try {
        const res = await fetch('/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: text, tts, session_id: SESSION_ID })
        });
        await consumeSSE(res, {
          onStatus: d => updateTyping(d.step, d),
          onResult: d => { removeTyping(); renderAnswer(d); },
          onError:  m => { removeTyping(); addMsg('bot', '❌ ' + esc(m)); },
        });
      } catch (e) {
        removeTyping();
        addMsg('bot', '❌ Erreur réseau : ' + esc(e.message));
      }
    }

    // ---- envoi fichier (réponse en SSE) ----
    async function sendFile(endpoint, file, loadingLabel) {
      addMsg('user', '📎 <em>' + esc(file.name) + '</em>');
      addTyping();
      toast(loadingLabel);
      const fd = new FormData();
      fd.append('file', file);
      fd.append('tts', $('tts').checked);
      fd.append('session_id', SESSION_ID);
      try {
        const res = await fetch(endpoint, { method: 'POST', body: fd });
        await consumeSSE(res, {
          onStatus: d => updateTyping(d.step, d),
          onResult: d => { removeTyping(); renderAnswer(d); },
          onError:  m => { removeTyping(); addMsg('bot', '❌ ' + esc(m)); },
        });
      } catch (e) {
        removeTyping();
        addMsg('bot', '❌ Erreur réseau : ' + esc(e.message));
      }
    }

    // ---- events ----
    $('send').addEventListener('click', () => sendText($('input').value, $('tts').checked));
    $('input').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('send').click(); }
    });
    $('input').addEventListener('input', autoGrow);
    function autoGrow() {
      const el = $('input');
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }

    document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
      $('input').value = c.dataset.q;
      autoGrow();
      $('input').focus();
    }));

    function bindFile(btnId, inputId, accept, action) {
      const btn = $(btnId), input = $(inputId);
      input.accept = accept;
      btn.addEventListener('click', () => input.click());
      input.addEventListener('change', () => {
        const f = input.files[0];
        if (!f) return;
        $('fileinfo').textContent = 'Fichier prêt : ' + f.name + ' (' + (f.size / 1024).toFixed(0) + ' Ko)';
        $('fileinfo').classList.add('show');
        action(f);
        input.value = '';
      });
    }
    bindFile('btn-image', 'file-image', 'image/*',
      f => sendFile('/ask/image', f, 'Extraction OCR en cours…'));

    // ---- Enregistrement micro (MediaRecorder) ----
    const recBtn = $('btn-audio'), recTimer = $('rec-timer');
    let mediaRecorder = null, chunks = [], recStart = 0, recTimerId = null;

    // Repli universel quand MediaRecorder est indisponible : l'input `capture`
    // ouvre l'enregistreur natif du téléphone, et le sélecteur de fichier
    // ailleurs. Fonctionne sur tous les navigateurs, y compris en HTTP.
    const audioInput = $('file-audio');
    audioInput.addEventListener('change', () => {
      const f = audioInput.files[0];
      if (!f) return;
      $('fileinfo').textContent = 'Fichier prêt : ' + f.name + ' (' + (f.size / 1024).toFixed(0) + ' Ko)';
      $('fileinfo').classList.add('show');
      sendFile('/ask/audio', f, 'Transcription vocale en cours…');
      audioInput.value = '';
    });

    // Chaque navigateur impose son conteneur : Chrome/Edge → webm/opus,
    // Firefox → ogg/opus, Safari → mp4/aac. On laisse le navigateur choisir son
    // défaut et on en déduit seulement l'extension : le backend décode les trois
    // (librosa → ffmpeg).
    function extPourType(type) {
      if (!type) return 'webm';
      if (type.includes('mp4') || type.includes('aac')) return 'm4a';
      if (type.includes('ogg')) return 'ogg';
      return 'webm';
    }

    // `navigator.mediaDevices` n'existe que dans un contexte sécurisé (HTTPS,
    // ou http://localhost selon le navigateur). Distinguer ce cas d'un vrai
    // défaut de support évite un message trompeur.
    function raisonMicroIndisponible() {
      if (!window.isSecureContext) {
        return "l'enregistrement direct exige une origine sécurisée (HTTPS). "
             + "En HTTP il n'est possible que sur localhost, et Safari refuse même là.";
      }
      return "ce navigateur ne gère pas l'enregistrement direct.";
    }

    function fmtTime(ms) {
      const s = Math.floor(ms / 1000);
      const m = Math.floor(s / 60), r = s % 60;
      return m + ':' + String(r).padStart(2, '0');
    }

    async function toggleRecord() {
      if (mediaRecorder && mediaRecorder.state === 'recording') { stopRecording(); return; }
      if (!navigator.mediaDevices || !window.MediaRecorder) {
        toast('🎙️ Micro : ' + raisonMicroIndisponible() + ' Envoyez un fichier audio à la place.');
        audioInput.click();
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        chunks = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
        mediaRecorder.onstop = () => {
          // `mimeType` peut être vide sur certains navigateurs : on retombe sur
          // webm plutôt que de laisser un `.includes()` lever une exception.
          const type = mediaRecorder.mimeType || 'audio/webm';
          const blob = new Blob(chunks, { type });
          stream.getTracks().forEach(t => t.stop());
          recBtn.classList.remove('rec');
          recTimer.textContent = 'micro';
          clearInterval(recTimerId);
          const file = new File([blob], 'microphone.' + extPourType(type), { type });
          sendFile('/ask/audio', file, 'Transcription vocale en cours…');
        };
        mediaRecorder.start();
        recStart = Date.now();
        recTimer.textContent = '0:00';
        recBtn.classList.add('rec');
        recTimerId = setInterval(() => recTimer.textContent = fmtTime(Date.now() - recStart), 250);
        toast('🎙️ Enregistrement… recliquez pour arrêter');
      } catch (e) {
        // NotAllowedError = permission refusée, NotFoundError = aucun micro.
        toast('❌ Micro inaccessible (' + (e.name || 'erreur') + ') : ' + e.message);
      }
    }
    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
    }

    recBtn.addEventListener('click', toggleRecord);

    // message de bienvenue
    addMsg('bot',
      '<span class="lang-tag">Assistant administratif sénégalais — V3</span>' +
      'Salam aléikum ! 👋 Je vous aide pour vos démarches administratives.<br>' +
      'Posez votre question en <b>wolof</b> ou en <b>français</b> : tapez, <b>parlez dans le micro</b> 🎙️ ou envoyez une photo.<br>' +
      '<small style="color:var(--muted)">Mode: <b>REST + SSE</b> (réponse en streaming)</small>');
  </script>
</body>

</html>
